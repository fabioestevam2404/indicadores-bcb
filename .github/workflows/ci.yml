name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # scripts/executar_diario.ps1 usa o Python de .venv\Scripts\python.exe,
      # como na máquina real; tests/test_scripts.py (só Windows) depende dele.
      - name: Criar .venv para os scripts PowerShell
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Testes com cobertura
        run: pytest -v --cov=indicadores --cov-report=term-missing --cov-fail-under=80

      - name: CLI responde (sem acessar a API)
        env:
          PYTHONPATH: src
        run: python -m indicadores --help
